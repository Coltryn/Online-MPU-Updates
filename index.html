<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locks Received Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }
  h1 { color: #58a6ff; margin-bottom: 0.5rem; }
  .subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }

  .form-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  @media (max-width: 700px) {
    .form-grid { grid-template-columns: 1fr 1fr; }
  }
  label {
    display: block;
    font-size: 0.75rem;
    color: #8b949e;
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input {
    width: 100%;
    padding: 0.6rem;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: #58a6ff; }

  .actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    font-family: inherit;
  }
  .btn-primary { background: #238636; color: white; }
  .btn-primary:hover { background: #2ea043; }
  .btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
  .btn-secondary:hover { background: #30363d; }
  .btn-danger { background: transparent; color: #f85149; border: 1px solid #f85149; padding: 0.3rem 0.7rem; font-size: 0.8rem; }
  .btn-danger:hover { background: #f85149; color: white; }

  .stats {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .stat {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    flex: 1;
    min-width: 120px;
  }
  .stat-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 1.5rem; font-weight: 600; color: #58a6ff; margin-top: 0.25rem; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 0.75rem;
    text-align: left;
    border-bottom: 1px solid #30363d;
    font-size: 0.9rem;
  }
  th {
    background: #1c2128;
    color: #8b949e;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  tr:last-child td { border-bottom: none; }
  .qty { color: #3fb950; font-weight: 600; }
  .empty { text-align: center; color: #8b949e; padding: 2rem; }
  .timestamp { color: #8b949e; font-size: 0.8rem; }
</style>
</head>
<body>

<h1>🔒 Locks Received Tracker</h1>
<p class="subtitle">Log every update with title, quantity, reporter, and handler.</p>

<!-- ===== FORM ===== -->
<div class="form-card">
  <div class="form-grid">
    <div>
      <label for="title">Title / Item</label>
      <input id="title" type="text" placeholder="e.g. Locks received" />
    </div>
    <div>
      <label for="qty">Quantity</label>
      <input id="qty" type="number" min="0" placeholder="0" />
    </div>
    <div>
      <label for="reporter">Reporter</label>
      <input id="reporter" type="text" placeholder="Who reported" />
    </div>
    <div>
      <label for="handler">Handler</label>
      <input id="handler" type="text" placeholder="Who handled" />
    </div>
  </div>
  <div class="actions">
    <button class="btn-primary" onclick="addEntry()">➕ Add Update</button>
    <button class="btn-secondary" onclick="exportData()">⬇ Export JSON</button>
    <button class="btn-secondary" onclick="document.getElementById('importFile').click()">⬆ Import JSON</button>
    <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)" />
  </div>
</div>

<!-- ===== STATS ===== -->
<div class="stats">
  <div class="stat">
    <div class="stat-label">Total Entries</div>
    <div class="stat-value" id="statEntries">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Total Quantity</div>
    <div class="stat-value" id="statQty">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Last Update</div>
    <div class="stat-value" id="statLast" style="font-size:0.95rem;">—</div>
  </div>
</div>

<!-- ===== TABLE ===== -->
<table id="table">
  <thead>
    <tr>
      <th>Title</th>
      <th>Qty</th>
      <th>Reporter</th>
      <th>Handler</th>
      <th>Time</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
// ===== STORAGE KEY =====
const STORAGE_KEY = 'locks_tracker_entries';

// ===== STATE =====
let entries = [];

// ===== LOAD / SAVE =====
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch {
    entries = [];
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// ===== ADD =====
function addEntry() {
  const title = document.getElementById('title').value.trim();
  const qty = parseInt(document.getElementById('qty').value, 10);
  const reporter = document.getElementById('reporter').value.trim();
  const handler = document.getElementById('handler').value.trim();

  if (!title) return alert('Please enter a title.');
  if (!qty || qty < 0) return alert('Please enter a valid quantity.');
  if (!reporter) return alert('Please enter a reporter.');
  if (!handler) return alert('Please enter a handler.');

  entries.unshift({
    id: Date.now(),
    title,
    qty,
    reporter,
    handler,
    time: new Date().toISOString()
  });

  save();
  render();
  clearForm();
  document.getElementById('title').focus();
}

function clearForm() {
  ['title', 'qty', 'reporter', 'handler'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

// ===== DELETE =====
function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  save();
  render();
}

// ===== RENDER =====
function render() {
  const tbody = document.getElementById('tbody');
  const table = document.getElementById('table');

  if (entries.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">No entries yet. Add your first update above.</td></tr>`;
  } else {
    tbody.innerHTML = entries.map(e => `
      <tr>
        <td>${escapeHtml(e.title)}</td>
        <td class="qty">${e.qty}</td>
        <td>${escapeHtml(e.reporter)}</td>
        <td>${escapeHtml(e.handler)}</td>
        <td class="timestamp">${new Date(e.time).toLocaleString()}</td>
        <td><button class="btn-danger" onclick="deleteEntry(${e.id})">Delete</button></td>
      </tr>
    `).join('');
  }

  // Stats
  document.getElementById('statEntries').textContent = entries.length;
  document.getElementById('statQty').textContent = entries.reduce((s, e) => s + e.qty, 0);
  document.getElementById('statLast').textContent = entries.length
    ? new Date(entries[0].time).toLocaleString()
    : '—';
}

// ===== EXPORT / IMPORT =====
function exportData() {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `locks-tracker-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('Not an array');
      if (!confirm(`Import ${data.length} entries? This will replace current data.`)) return;
      entries = data;
      save();
      render();
    } catch (err) {
      alert('Invalid JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== HELPERS =====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== INIT =====
load();
render();
document.getElementById('title').focus();
</script>

</body>
</html>
