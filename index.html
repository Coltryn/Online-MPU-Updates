<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M0F0K3NG🐇ONLINE</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    max-width: 950px;
    margin: 0 auto;
    padding: 2rem 1rem;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ===== FLOATING RABBITS ===== */
  #rabbits {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .rabbit {
    position: absolute;
    font-size: 2rem;
    opacity: 0.15;
    animation: float linear infinite;
    user-select: none;
  }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-40px) rotate(10deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* ===== WELCOME ===== */
  #welcome {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 80vh; text-align: center; gap: 1.5rem;
  }
  #welcome h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    margin: 0;
    background: linear-gradient(90deg, #58a6ff, #bc8cff, #3fb950);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #welcome p { color: #8b949e; font-size: 1.1rem; max-width: 500px; }
  .enter-btn {
    background: #238636; color: white; border: none;
    padding: 1rem 2.5rem; border-radius: 999px;
    font-size: 1.1rem; font-weight: 600; cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }
  .enter-btn:hover { background: #2ea043; transform: scale(1.05); }

  /* ===== APP ===== */
  #app { position: relative; z-index: 1; display: none; }
  h1.app-title {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    margin: 0 0 0.25rem;
    background: linear-gradient(90deg, #58a6ff, #bc8cff, #3fb950);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }

  /* ===== TABS ===== */
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .tab {
    padding: 0.6rem 1.1rem;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 999px; color: #8b949e;
    cursor: pointer; font-size: 0.9rem; font-weight: 500;
    transition: all 0.15s;
  }
  .tab:hover { border-color: #58a6ff; color: #e6edf3; }
  .tab.active { background: #1f6feb; border-color: #1f6feb; color: white; }
  .tab .count { opacity: 0.7; font-size: 0.8rem; margin-left: 0.35rem; }

  /* ===== FORM ===== */
  .form-card {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.75rem; margin-bottom: 0.75rem;
  }
  label {
    display: block; font-size: 0.75rem; color: #8b949e;
    margin-bottom: 0.25rem;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input, select, textarea {
    width: 100%; padding: 0.6rem;
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; color: #e6edf3;
    font-size: 0.95rem; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #58a6ff;
  }

  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  button {
    padding: 0.6rem 1.1rem; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.9rem; font-weight: 500;
    font-family: inherit;
  }
  .btn-primary { background: #238636; color: white; }
  .btn-primary:hover { background: #2ea043; }
  .btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
  .btn-secondary:hover { background: #30363d; }
  .btn-danger {
    background: transparent; color: #f85149;
    border: 1px solid #f85149;
    padding: 0.3rem 0.7rem; font-size: 0.8rem;
  }
  .btn-danger:hover { background: #f85149; color: white; }

  /* ===== STATUS PILLS ===== */
  .pill {
    display: inline-block; padding: 0.15rem 0.6rem;
    border-radius: 999px; font-size: 0.75rem; font-weight: 600;
  }
  .pill-operational { background: #23863633; color: #3fb950; border: 1px solid #3fb95055; }
  .pill-faulty      { background: #f8514933; color: #f85149; border: 1px solid #f8514955; }
  .pill-mobile      { background: #58a6ff33; color: #58a6ff; border: 1px solid #58a6ff55; }
  .pill-static      { background: #bc8cff33; color: #bc8cff; border: 1px solid #bc8cff55; }

  /* ===== STATS ===== */
  .stats { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .stat {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 0.75rem 1rem;
    flex: 1; min-width: 120px;
  }
  .stat-label {
    font-size: 0.7rem; color: #8b949e;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 1.5rem; font-weight: 600;
    color: #58a6ff; margin-top: 0.25rem;
  }

  /* ===== TABLE ===== */
  table {
    width: 100%; border-collapse: collapse;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; overflow: hidden;
  }
  th, td {
    padding: 0.75rem; text-align: left;
    border-bottom: 1px solid #30363d; font-size: 0.9rem;
    vertical-align: top;
  }
  th {
    background: #1c2128; color: #8b949e;
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  tr:last-child td { border-bottom: none; }
  .qty { color: #3fb950; font-weight: 600; }
  .empty { text-align: center; color: #8b949e; padding: 2rem; }
  .timestamp { color: #8b949e; font-size: 0.8rem; white-space: nowrap; }
</style>
</head>
<body>

<div id="rabbits"></div>

<!-- ===== WELCOME ===== -->
<div id="welcome">
  <div style="font-size: 4rem;">🐇</div>
  <h1>M0F0K3NG🐇ONLINE</h1>
  <p>Track your Generator, Bowser, Locks, and Load cables — all in one place.</p>
  <button class="enter-btn" onclick="enterApp()">Enter Tracker 🐇</button>
</div>

<!-- ===== APP ===== -->
<div id="app">

  <h1 class="app-title">M0F0K3NG🐇ONLINE</h1>
  <p class="subtitle">Select a category, then log your update.</p>

  <div class="tabs" id="tabs"></div>

  <div class="form-card">
    <div class="form-grid" id="formGrid"></div>
    <div class="actions">
      <button class="btn-primary" onclick="addEntry()">➕ Add Update</button>
      <button class="btn-secondary" onclick="exportData()">⬇ Export JSON</button>
      <button class="btn-secondary" onclick="document.getElementById('importFile').click()">⬆ Import JSON</button>
      <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Entries (this category)</div>
      <div class="stat-value" id="statEntries">0</div>
    </div>
    <div class="stat">
      <div class="stat-label" id="statQtyLabel">Total Quantity</div>
      <div class="stat-value" id="statQty">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Last Update</div>
      <div class="stat-value" id="statLast" style="font-size:0.95rem;">—</div>
    </div>
  </div>

  <table>
    <thead id="tableHead"></thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<script>
// ===== CONFIG =====
const STORAGE_KEY = 'mofokeng_tracker_entries';

/* Each category defines:
   - fields:     the form inputs to render
   - columns:    the table headers + how to pull each cell value
   - qtyField:   which field to sum for the "Total" stat (or null)
   - qtyLabel:   label for that stat
*/
const CATEGORIES = {
  'Generator': {
    fields: [
      { id: 'type',   label: 'Type',   type: 'select', options: ['Mobile', 'Static'] },
      { id: 'status', label: 'Status', type: 'select', options: ['Operational', 'Faulty'] },
      { id: 'reported', label: 'Reported', type: 'textarea', placeholder: 'Describe what was reported...' }
    ],
    columns: [
      { label: 'Type',   render: e => pill(e.type, e.type.toLowerCase()) },
      { label: 'Status', render: e => pill(e.status, e.status === 'Faulty' ? 'faulty' : 'operational') },
      { label: 'Reported', render: e => escapeHtml(e.reported || '') }
    ],
    qtyField: null,
    qtyLabel: 'Total'
  },

  'Bowser': {
    fields: [
      { id: 'item',     label: 'Item',     type: 'select', options: ['Bowser'] },
      { id: 'qty',      label: 'Quantity', type: 'number', placeholder: '0' },
      { id: 'reporter', label: 'Reporter', type: 'text',   placeholder: 'Who reported' },
      { id: 'handler',  label: 'Handler',  type: 'text',   placeholder: 'Who handled' }
    ],
    columns: [
      { label: 'Item',     render: e => escapeHtml(e.item) },
      { label: 'Qty',      render: e => `<span class="qty">${e.qty}</span>` },
      { label: 'Reporter', render: e => escapeHtml(e.reporter) },
      { label: 'Handler',  render: e => escapeHtml(e.handler) }
    ],
    qtyField: 'qty',
    qtyLabel: 'Total Quantity'
  },

  'Locks': {
    fields: [
      { id: 'item',     label: 'Item',     type: 'select', options: ['Locks'] },
      { id: 'qty',      label: 'Quantity', type: 'number', placeholder: '0' },
      { id: 'reporter', label: 'Reporter', type: 'text',   placeholder: 'Who reported' },
      { id: 'handler',  label: 'Handler',  type: 'text',   placeholder: 'Who handled' }
    ],
    columns: [
      { label: 'Item',     render: e => escapeHtml(e.item) },
      { label: 'Qty',      render: e => `<span class="qty">${e.qty}</span>` },
      { label: 'Reporter', render: e => escapeHtml(e.reporter) },
      { label: 'Handler',  render: e => escapeHtml(e.handler) }
    ],
    qtyField: 'qty',
    qtyLabel: 'Total Quantity'
  },

  'Load cables': {
    fields: [
      { id: 'qty',       label: 'Quantity',  type: 'number',   placeholder: '9', value: '9' },
      { id: 'collected', label: 'Collected', type: 'textarea', placeholder: 'Who collected / notes...' }
    ],
    columns: [
      { label: 'Qty',       render: e => `<span class="qty">${e.qty}</span>` },
      { label: 'Collected', render: e => escapeHtml(e.collected || '') }
    ],
    qtyField: 'qty',
    qtyLabel: 'Total Quantity'
  }
};

// ===== STATE =====
let entries = [];
let activeCategory = 'Generator';

// ===== STORAGE =====
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch { entries = []; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// ===== RABBITS =====
function spawnRabbits() {
  const container = document.getElementById('rabbits');
  for (let i = 0; i < 18; i++) {
    const r = document.createElement('div');
    r.className = 'rabbit';
    r.textContent = '🐇';
    r.style.left = Math.random() * 100 + '%';
    r.style.top = Math.random() * 100 + '%';
    r.style.fontSize = (1.2 + Math.random() * 2.5) + 'rem';
    r.style.animationDuration = (6 + Math.random() * 8) + 's';
    r.style.animationDelay = (-Math.random() * 5) + 's';
    container.appendChild(r);
  }
}

// ===== NAVIGATION =====
function enterApp() {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderTabs();
  renderForm();
  render();
}

// ===== TABS =====
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.keys(CATEGORIES).map(cat => {
    const count = entries.filter(e => e.category === cat).length;
    return `<button class="tab ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
      ${cat}<span class="count">(${count})</span>
    </button>`;
  }).join('');
}

function selectCategory(cat) {
  activeCategory = cat;
  renderTabs();
  renderForm();
  render();
}

// ===== FORM RENDERING =====
function renderForm() {
  const grid = document.getElementById('formGrid');
  const fields = CATEGORIES[activeCategory].fields;

  grid.innerHTML = fields.map(f => {
    const id = 'f_' + f.id;
    if (f.type === 'select') {
      const opts = f.options.map(o => `<option value="${o}">${o}</option>`).join('');
      return `<div><label for="${id}">${f.label}</label><select id="${id}">${opts}</select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div style="grid-column: 1 / -1;">
        <label for="${id}">${f.label}</label>
        <textarea id="${id}" placeholder="${f.placeholder || ''}"></textarea>
      </div>`;
    }
    if (f.type === 'number') {
      return `<div><label for="${id}">${f.label}</label>
        <input id="${id}" type="number" min="0" placeholder="${f.placeholder || ''}" value="${f.value || ''}" /></div>`;
    }
    return `<div><label for="${id}">${f.label}</label>
      <input id="${id}" type="text" placeholder="${f.placeholder || ''}" /></div>`;
  }).join('');
}

function clearForm() {
  const fields = CATEGORIES[activeCategory].fields;
  fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if (!el) return;
    if (f.type === 'select') el.selectedIndex = 0;
    else if (f.value !== undefined) el.value = f.value;
    else el.value = '';
  });
}

// ===== ADD =====
function addEntry() {
  const fields = CATEGORIES[activeCategory].fields;
  const data = {};
  let error = null;

  fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    let val = el.value;

    if (f.type === 'number') {
      val = parseInt(val, 10);
      if (isNaN(val) || val < 0) { error = error || `Please enter a valid ${f.label.toLowerCase()}.`; return; }
    } else if (f.type === 'text' || f.type === 'textarea') {
      val = val.trim();
      if (!val) { error = error || `Please fill in ${f.label}.`; return; }
    }
    data[f.id] = val;
  });

  if (error) return alert(error);

  entries.unshift({
    id: Date.now(),
    category: activeCategory,
    ...data,
    time: new Date().toISOString()
  });

  save();
  renderTabs();
  render();
  clearForm();
}

// ===== DELETE =====
function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  save();
  renderTabs();
  render();
}

// ===== RENDER =====
function render() {
  const cat = CATEGORIES[activeCategory];
  const filtered = entries.filter(e => e.category === activeCategory);

  // Table head
  const head = document.getElementById('tableHead');
  head.innerHTML = `<tr>
    ${cat.columns.map(c => `<th>${c.label}</th>`).join('')}
    <th>Time</th><th></th>
  </tr>`;

  // Table body
  const tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${cat.columns.length + 2}" class="empty">
      No entries in <strong>${activeCategory}</strong> yet.
    </td></tr>`;
  } else {
    tbody.innerHTML = filtered.map(e => `
      <tr>
        ${cat.columns.map(c => `<td>${c.render(e)}</td>`).join('')}
        <td class="timestamp">${new Date(e.time).toLocaleString()}</td>
        <td><button class="btn-danger" onclick="deleteEntry(${e.id})">Delete</button></td>
      </tr>
    `).join('');
  }

  // Stats
  document.getElementById('statEntries').textContent = filtered.length;
  document.getElementById('statQtyLabel').textContent = cat.qtyLabel;
  document.getElementById('statQty').textContent = cat.qtyField
    ? filtered.reduce((s, e) => s + (Number(e[cat.qtyField]) || 0), 0)
    : '—';
  document.getElementById('statLast').textContent = filtered.length
    ? new Date(filtered[0].time).toLocaleString()
    : '—';
}

// ===== EXPORT / IMPORT =====
function exportData() {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mofokeng-tracker-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('Not an array');
      if (!confirm(`Import ${data.length} entries? This will replace current data.`)) return;
      entries = data;
      save();
      renderTabs();
      render();
    } catch (err) {
      alert('Invalid JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== HELPERS =====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function pill(text, cls) {
  return `<span class="pill pill-${cls}">${escapeHtml(text)}</span>`;
}

// ===== INIT =====
spawnRabbits();
load();
renderForm();
</script>

</body>
</html>
