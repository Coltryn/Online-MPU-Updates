<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M0F0K3NG🐇ONLINE</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 1rem;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  #rabbits {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .rabbit {
    position: absolute; font-size: 2rem;
    opacity: 0.15; animation: float linear infinite;
    user-select: none;
  }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-40px) rotate(10deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  #welcome {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 80vh; text-align: center; gap: 1.5rem;
  }
  #welcome h1 {
    font-size: clamp(2rem, 6vw, 3.5rem); margin: 0;
    background: linear-gradient(90deg, #58a6ff, #bc8cff, #3fb950);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #welcome p { color: #8b949e; font-size: 1.1rem; max-width: 500px; }
  .enter-btn {
    background: #238636; color: white; border: none;
    padding: 1rem 2.5rem; border-radius: 999px;
    font-size: 1.1rem; font-weight: 600; cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }
  .enter-btn:hover { background: #2ea043; transform: scale(1.05); }

  #app { position: relative; z-index: 1; display: none; }
  h1.app-title {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    margin: 0 0 0.25rem;
    background: linear-gradient(90deg, #58a6ff, #bc8cff, #3fb950);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: #8b949e; margin-bottom: 1.5rem; font-size: 0.9rem; }

  .conn-status {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-size: 0.8rem; padding: 0.3rem 0.7rem;
    border-radius: 999px; margin-bottom: 1rem;
  }
  .conn-online  { background: #23863633; color: #3fb950; border: 1px solid #3fb95055; }
  .conn-offline { background: #f8514933; color: #f85149; border: 1px solid #f8514955; }
  .conn-loading { background: #d2992233; color: #d29922; border: 1px solid #d2992255; }

  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .tab {
    padding: 0.6rem 1.1rem;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 999px; color: #8b949e;
    cursor: pointer; font-size: 0.9rem; font-weight: 500;
    transition: all 0.15s;
  }
  .tab:hover { border-color: #58a6ff; color: #e6edf3; }
  .tab.active { background: #1f6feb; border-color: #1f6feb; color: white; }
  .tab .count { opacity: 0.7; font-size: 0.8rem; margin-left: 0.35rem; }

  .balance-banner {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, #1f6feb22, #bc8cff22);
    border: 1px solid #58a6ff55;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap; gap: 1rem;
  }
  .balance-banner .label {
    font-size: 0.8rem; color: #8b949e;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .balance-banner .value {
    font-size: 2.5rem; font-weight: 700;
    background: linear-gradient(90deg, #58a6ff, #bc8cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .balance-banner .start {
    font-size: 0.8rem; color: #8b949e;
    margin-top: 0.4rem;
  }

  .form-card {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.75rem; margin-bottom: 0.75rem;
  }
  label {
    display: block; font-size: 0.75rem; color: #8b949e;
    margin-bottom: 0.25rem;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  input, select, textarea {
    width: 100%; padding: 0.6rem;
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; color: #e6edf3;
    font-size: 0.95rem; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #58a6ff;
  }
  .hint {
    font-size: 0.75rem; color: #8b949e;
    margin-top: 0.35rem; font-style: italic;
  }

  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  button {
    padding: 0.6rem 1.1rem; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.9rem; font-weight: 500;
    font-family: inherit;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #238636; color: white; }
  .btn-primary:hover:not(:disabled) { background: #2ea043; }
  .btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
  .btn-secondary:hover { background: #30363d; }
  .btn-danger {
    background: transparent; color: #f85149;
    border: 1px solid #f85149;
    padding: 0.3rem 0.7rem; font-size: 0.8rem;
  }
  .btn-danger:hover { background: #f85149; color: white; }

  .pill {
    display: inline-block; padding: 0.15rem 0.6rem;
    border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    white-space: nowrap;
  }
  .pill-operational { background: #23863633; color: #3fb950; border: 1px solid #3fb95055; }
  .pill-faulty      { background: #f8514933; color: #f85149; border: 1px solid #f8514955; }
  .pill-mobile      { background: #58a6ff33; color: #58a6ff; border: 1px solid #58a6ff55; }
  .pill-static      { background: #bc8cff33; color: #bc8cff; border: 1px solid #bc8cff55; }
  .pill-trailer     { background: #58a6ff33; color: #58a6ff; border: 1px solid #58a6ff55; }
  .pill-bakkie      { background: #bc8cff33; color: #bc8cff; border: 1px solid #bc8cff55; }
  .pill-stolen      { background: #f8514933; color: #f85149; border: 1px solid #f8514955; }
  .pill-collected   { background: #23863633; color: #3fb950; border: 1px solid #3fb95055; }
  .pill-additional  { background: #d2992233; color: #d29922; border: 1px solid #d2992255; }

  .table-wrap { overflow-x: auto; border-radius: 8px; }
  table {
    width: 100%; border-collapse: collapse;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 8px; overflow: hidden;
    min-width: 700px;
  }
  th, td {
    padding: 0.75rem; text-align: left;
    border-bottom: 1px solid #30363d; font-size: 0.9rem;
    vertical-align: top;
  }
  th {
    background: #1c2128; color: #8b949e;
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.5px; white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  .qty { color: #3fb950; font-weight: 600; }
  .qty-neg { color: #f85149; font-weight: 600; }
  .qty-no { color: #8b949e; font-weight: 600; }
  .empty { text-align: center; color: #8b949e; padding: 2rem; }
  .timestamp { color: #8b949e; font-size: 0.8rem; white-space: nowrap; }
  .remark-cell { max-width: 260px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>

<div id="rabbits"></div>

<!-- ===== WELCOME ===== -->
<div id="welcome">
  <div style="font-size: 4rem;">🐇</div>
  <h1>M0F0K3NG🐇ONLINE</h1>
  <p>Track your Generator, Bowser, Locks, and Load cables — all in one place.</p>
  <button class="enter-btn" onclick="enterApp()">Enter Tracker 🐇</button>
</div>

<!-- ===== APP ===== -->
<div id="app">

  <h1 class="app-title">M0F0K3NG🐇ONLINE</h1>
  <div id="connStatus" class="conn-status conn-loading">⏳ Connecting...</div>

  <div class="tabs" id="tabs"></div>

  <div id="balanceBanner" class="balance-banner" style="display:none;">
    <div>
      <div class="label">Current Balance</div>
      <div class="value" id="balanceValue">—</div>
      <div class="start" id="balanceStart">—</div>
    </div>
    <div style="text-align:right;">
      <div class="label">This Session</div>
      <div style="font-size:0.9rem; margin-top:0.4rem;" id="balanceBreakdown">—</div>

  <div class="form-card">

  <div class="table-wrap">

      <thead id="tableHead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
// ============================================================
//  CONFIG — PASTE YOUR ANON KEY BELOW
// ============================================================
const SUPABASE_URL = 'https://ofqmzcnqxlboxwcoebat.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mcW16Y25xeGxib3h3Y29lYmF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NzIwMDYsImV4cCI6MjEwNTM0ODAwNn0.zR4JZg6vw1g_yMm8Hffw3qAeLNVXJYtYuW2sclFknSA';   // <-- from Project Settings → API → anon public

// ============================================================
//  CONSTANTS
// ============================================================
const TABLE = 'entries';
const STARTING_BALANCE = { 'Locks': 19, 'Load cables': 9 };
const TYPE_EFFECT = { 'Collected': 'subtract', 'Additional': 'add', 'Stolen': 'none' };

const CATEGORIES = {
  'Generator': {
    hasBalance: false,
    fields: [
      { id: 'type',     label: 'Type',     type: 'select', options: ['Mobile', 'Static'] },
      { id: 'reg',      label: 'Reg',      type: 'text',   placeholder: 'Registration / serial' },
      { id: 'status',   label: 'Status',   type: 'select', options: ['Operational', 'Faulty'] },
      { id: 'reported', label: 'Reported', type: 'text',   placeholder: 'Who reported' },
      { id: 'remark',   label: 'Remark',   type: 'textarea', placeholder: 'Notes...' }
    ],
    columns: [
      { label: 'Type',     render: e => pill(e.type, e.type.toLowerCase()) },
      { label: 'Reg',      render: e => escapeHtml(e.reg || '') },
      { label: 'Status',   render: e => pill(e.status, e.status === 'Faulty' ? 'faulty' : 'operational') },
      { label: 'Reported', render: e => escapeHtml(e.reported || '') },
      { label: 'Remark',   render: e => `<div class="remark-cell">${escapeHtml(e.remark || '')}</div>` }
    ]
  },
  'Bowser': {
    hasBalance: false,
    fields: [
      { id: 'type',     label: 'Type',     type: 'select', options: ['Trailer', 'Bakkie'] },
      { id: 'reg',      label: 'Reg',      type: 'text',   placeholder: 'Registration' },
      { id: 'status',   label: 'Status',   type: 'select', options: ['Operational', 'Faulty'] },
      { id: 'reported', label: 'Reported', type: 'text',   placeholder: 'Who reported' },
      { id: 'remark',   label: 'Remark',   type: 'textarea', placeholder: 'Notes...' }
    ],
    columns: [
      { label: 'Type',     render: e => pill(e.type, e.type === 'Bakkie' ? 'bakkie' : 'trailer') },
      { label: 'Reg',      render: e => escapeHtml(e.reg || '') },
      { label: 'Status',   render: e => pill(e.status, e.status === 'Faulty' ? 'faulty' : 'operational') },
      { label: 'Reported', render: e => escapeHtml(e.reported || '') },
      { label: 'Remark',   render: e => `<div class="remark-cell">${escapeHtml(e.remark || '')}</div>` }
    ]
  },
  'Locks': {
    hasBalance: true,
    fields: [
      { id: 'type',    label: 'Type',     type: 'select', options: ['Stolen', 'Collected', 'Additional'] },
      { id: 'qty',     label: 'Quantity', type: 'number', placeholder: '0' },
      { id: 'handler', label: 'Handler',  type: 'text',   placeholder: 'Who handled' },
      { id: 'remark',  label: 'Remark',   type: 'textarea', placeholder: 'Notes...' }
    ],
    columns: [
      { label: 'Type',    render: e => pill(e.type, e.type.toLowerCase()) },
      { label: 'Qty',     render: e => qtyCell(e) },
      { label: 'Handler', render: e => escapeHtml(e.handler || '') },
      { label: 'Remark',  render: e => `<div class="remark-cell">${escapeHtml(e.remark || '')}</div>` }
    ]
  },
  'Load cables': {
    hasBalance: true,
    fields: [
      { id: 'type',    label: 'Type',     type: 'select', options: ['Stolen', 'Collected', 'Additional'] },
      { id: 'qty',     label: 'Quantity', type: 'number', placeholder: '0' },
      { id: 'handler', label: 'Handler',  type: 'text',   placeholder: 'Who handled' },
      { id: 'remark',  label: 'Remark',   type: 'textarea', placeholder: 'Notes...' }
    ],
    columns: [
      { label: 'Type',    render: e => pill(e.type, e.type.toLowerCase()) },
      { label: 'Qty',     render: e => qtyCell(e) },
      { label: 'Handler', render: e => escapeHtml(e.handler || '') },
      { label: 'Remark',  render: e => `<div class="remark-cell">${escapeHtml(e.remark || '')}</div>` }
    ]
  }
};

// ============================================================
//  STATE
// ============================================================
let entries = [];        // array of { id, category, ...fields, created_at }
let activeCategory = 'Generator';
let connected = false;
let loadInProgress = false;

// ============================================================
//  SUPABASE REST HELPERS
// ============================================================
function apiHeaders() {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json'
  };
}

async function fetchEntries() {
  const url = `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=created_at.desc`;
  const res = await fetch(url, { headers: apiHeaders() });
  if (!res.ok) throw new Error(`Fetch failed: ${res.status} ${await res.text()}`);
  return await res.json();
}

async function insertEntry(category, data) {
  const url = `${SUPABASE_URL}/rest/v1/${TABLE}`;
  const body = [{ category, data }];
  const res = await fetch(url, {
    method: 'POST',
    headers: { ...apiHeaders(), 'Prefer': 'return=representation' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Insert failed: ${res.status} ${await res.text()}`);
  const [row] = await res.json();
  return row;
}

async function deleteEntryDB(id) {
  const url = `${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`;
  const res = await fetch(url, { method: 'DELETE', headers: apiHeaders() });
  if (!res.ok) throw new Error(`Delete failed: ${res.status} ${await res.text()}`);
}

// ============================================================
//  DATA SHAPE NORMALIZATION
//  DB row: { id, category, data: {..fields..}, created_at }
//  Local shape: { id, category, ...fields, time }
// ============================================================
function rowToEntry(row) {
  return {
    id: row.id,
    category: row.category,
    ...(row.data || {}),
    time: row.created_at
  };
}

// ============================================================
//  CLOUD SYNC
// ============================================================
async function refreshFromCloud(silent = false) {
  if (loadInProgress) return;
  loadInProgress = true;
  setConnStatus('loading', '⏳ Syncing...');
  try {
    const rows = await fetchEntries();
    entries = rows.map(rowToEntry);
    connected = true;
    setConnStatus('online', '✅ Connected — data synced');
  } catch (err) {
    console.error(err);
    connected = false;
    setConnStatus('offline', '⚠️ Offline — showing cached data');
    if (!silent) alert('Could not reach Supabase:\n\n' + err.message);
  } finally {
    loadInProgress = false;
  }
  renderTabs();
  render();
}

function setConnStatus(state, text) {
  const el = document.getElementById('connStatus');
  el.className = 'conn-status conn-' + state;
  el.textContent = text;
}

// ============================================================
//  BALANCE
// ============================================================
function getBalance(category) {
  const start = STARTING_BALANCE[category] || 0;
  const breakdown = { collected: 0, additional: 0, stolen: 0 };
  const sorted = [...entries]
    .filter(e => e.category === category)
    .sort((a, b) => new Date(a.time) - new Date(b.time));

  let balance = start;
  for (const e of sorted) {
    const effect = TYPE_EFFECT[e.type];
    const qty = Number(e.qty) || 0;
    if (effect === 'subtract') { balance -= qty; breakdown.collected += qty; }
    else if (effect === 'add') { balance += qty; breakdown.additional += qty; }
    else if (effect === 'none') { breakdown.stolen += qty; }
  }
  return { balance, start, breakdown };
}

// ============================================================
//  RABBITS
// ============================================================
function spawnRabbits() {
  const container = document.getElementById('rabbits');
  for (let i = 0; i < 18; i++) {
    const r = document.createElement('div');
    r.className = 'rabbit';
    r.textContent = '🐇';
    r.style.left = Math.random() * 100 + '%';
    r.style.top = Math.random() * 100 + '%';
    r.style.fontSize = (1.2 + Math.random() * 2.5) + 'rem';
    r.style.animationDuration = (6 + Math.random() * 8) + 's';
    r.style.animationDelay = (-Math.random() * 5) + 's';
    container.appendChild(r);
  }
}

// ============================================================
//  NAVIGATION
// ============================================================
async function enterApp() {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderForm();
  await refreshFromCloud(true);
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.keys(CATEGORIES).map(cat => {
    const count = entries.filter(e => e.category === cat).length;
    return `<button class="tab ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
      ${cat}<span class="count">(${count})</span>
    </button>`;
  }).join('');
}

function selectCategory(cat) {
  activeCategory = cat;
  renderTabs();
  renderForm();
  render();
}

// ============================================================
//  FORM
// ============================================================
function renderForm() {
  const grid = document.getElementById('formGrid');
  const fields = CATEGORIES[activeCategory].fields;
  const hasBalance = CATEGORIES[activeCategory].hasBalance;

  grid.innerHTML = fields.map(f => {
    const id = 'f_' + f.id;
    if (f.type === 'select') {
      const opts = f.options.map(o => `<option value="${o}">${o}</option>`).join('');
      return `<div><label for="${id}">${f.label}</label><select id="${id}">${opts}</select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div style="grid-column: 1 / -1;">
        <label for="${id}">${f.label}</label>
        <textarea id="${id}" placeholder="${f.placeholder || ''}"></textarea>
      </div>`;
    }
    if (f.type === 'number') {
      const hint = hasBalance
        ? `<div class="hint">How many in THIS transaction (not the total)</div>`
        : '';
      return `<div><label for="${id}">${f.label}</label>
        <input id="${id}" type="number" min="0" placeholder="${f.placeholder || ''}" />
        ${hint}</div>`;
    }
    return `<div><label for="${id}">${f.label}</label>
      <input id="${id}" type="text" placeholder="${f.placeholder || ''}" /></div>`;
  }).join('');
}

function clearForm() {
  const fields = CATEGORIES[activeCategory].fields;
  fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    if (!el) return;
    if (f.type === 'select') el.selectedIndex = 0;
    else el.value = '';
  });
}

// ============================================================
//  ADD
// ============================================================
async function addEntry() {
  const cat = CATEGORIES[activeCategory];
  const data = {};
  let error = null;

  cat.fields.forEach(f => {
    const el = document.getElementById('f_' + f.id);
    let val = el.value;
    if (f.type === 'number') {
      val = parseInt(val, 10);
      if (isNaN(val) || val < 0) { error = error || `Please enter a valid ${f.label.toLowerCase()}.`; return; }
      if (val === 0) { error = error || 'Quantity must be greater than 0.'; return; }
    } else if (f.type === 'text' || f.type === 'textarea') {
      val = val.trim();
      if (!val) { error = error || `Please fill in ${f.label}.`; return; }
    }
    data[f.id] = val;
  });

  if (error) return alert(error);

  if (cat.hasBalance && TYPE_EFFECT[data.type] === 'subtract') {
    const { balance } = getBalance(activeCategory);
    if (data.qty > balance) {
      if (!confirm(`Only ${balance} in stock, but you're collecting ${data.qty}. Balance will go negative. Continue?`)) return;
    }
  }

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Saving...';

  try {
    const row = await insertEntry(activeCategory, data);
    entries.unshift(rowToEntry(row));
    renderTabs();
    render();
    clearForm();
  } catch (err) {
    alert('Could not save:\n\n' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '➕ Add Update';
  }
}

// ============================================================
//  DELETE
// ============================================================
async function removeEntry(id) {
  if (!confirm('Delete this entry? Balance will be recalculated.')) return;
  try {
    await deleteEntryDB(id);
    entries = entries.filter(e => e.id !== id);
    renderTabs();
    render();
  } catch (err) {
    alert('Could not delete:\n\n' + err.message);
  }
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  const cat = CATEGORIES[activeCategory];
  const filtered = entries.filter(e => e.category === activeCategory);

  document.getElementById('tableHead').innerHTML = `<tr>
    ${cat.columns.map(c => `<th>${c.label}</th>`).join('')}
    <th>Time</th><th></th>
  </tr>`;

  const tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${cat.columns.length + 2}" class="empty">
      No entries in <strong>${activeCategory}</strong> yet.
    </td></tr>`;
  } else {
    tbody.innerHTML = filtered.map(e => `
      <tr>
        ${cat.columns.map(c => `<td>${c.render(e)}</td>`).join('')}
        <td class="timestamp">${new Date(e.time).toLocaleString()}</td>
        <td><button class="btn-danger" onclick="removeEntry(${e.id})">Delete</button></td>
      </tr>
    `).join('');
  }

  const banner = document.getElementById('balanceBanner');
  if (cat.hasBalance) {
    banner.style.display = 'flex';
    const { balance, start, breakdown } = getBalance(activeCategory);
    document.getElementById('balanceValue').textContent = balance;
    document.getElementById('balanceStart').textContent =
      `Started at ${start} · Collected ${breakdown.collected} · Additional ${breakdown.additional} · Stolen ${breakdown.stolen}`;
    document.getElementById('balanceBreakdown').innerHTML =
      `<span class="pill pill-additional">+${breakdown.additional}</span> ` +
      `<span class="pill pill-stolen">−${breakdown.collected}</span> ` +
      `<span class="pill pill-stolen">${breakdown.stolen} stolen</span>`;
  } else {
    banner.style.display = 'none';
  }
}

function qtyCell(e) {
  const effect = TYPE_EFFECT[e.type];
  if (effect === 'subtract') return `<span class="qty qty-neg">−${e.qty}</span>`;
  if (effect === 'add')      return `<span class="qty">+${e.qty}</span>`;
  return `<span class="qty qty-no">${e.qty}</span>`;
}

// ============================================================
//  EXPORT / IMPORT (manual backup)
// ============================================================
function exportData() {
  const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mofokeng-tracker-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('Not an array');
      alert(`Imported ${data.length} entries into local memory.\n\nNote: this does NOT upload to the cloud — use the form to add entries that sync.`);
    } catch (err) {
      alert('Invalid JSON file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============================================================
//  HELPERS
// ============================================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function pill(text, cls) {
  return `<span class="pill pill-${cls}">${escapeHtml(text)}</span>`;
}

// ============================================================
//  AUTO-REFRESH every 20 seconds (keeps multiple devices in sync)
// ============================================================
setInterval(() => {
  if (document.getElementById('app').style.display === 'block') {
    refreshFromCloud(true);
  }
}, 20000);

// ============================================================
//  INIT
// ============================================================
spawnRabbits();
renderForm();
</script>
